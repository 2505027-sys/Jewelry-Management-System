<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxe Jewelry Management System</title>

<style>
:root{
--purple:#2b193a;
--deep:#1c1028;
--gold:#c29d59;
--cream:#f8f4ed;
--white:#fff;
--muted:#887d90;
--green:#25865a;
--red:#c34c4c;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:#30283a}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
button:disabled{opacity:.5;cursor:not-allowed}

.login-screen{
min-height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,var(--deep),#50365c);padding:20px
}
.login-card{
background:white;width:100%;max-width:430px;padding:35px;
border-radius:18px;box-shadow:0 15px 45px #0004
}
.logo{text-align:center;color:var(--gold);font-size:36px}
.login-card h2{text-align:center;color:var(--purple)}
.login-card p{text-align:center;color:var(--muted)}
.login-card button{width:100%}
.login-switch{text-align:center;margin-top:18px}

.app{min-height:100vh}
.sidebar{
width:240px;background:var(--purple);color:white;
position:fixed;top:0;bottom:0;padding:25px 15px;overflow:auto
}
.brand{font-size:23px;color:var(--gold);font-weight:bold;margin:8px 10px 35px}
.brand small{display:block;font-size:10px;letter-spacing:3px;color:#ddd;margin-top:6px}
.nav-label{color:#ad9bb8;font-size:11px;margin:22px 12px 8px}
.nav button{
display:block;width:100%;text-align:left;padding:13px 14px;
border:0;border-radius:8px;background:none;color:#eee;margin:4px 0
}
.nav button:hover,.nav button.active{background:var(--gold);color:var(--purple)}
.main{margin-left:240px;padding:28px;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px}
.topbar h1{margin:0;color:var(--purple);font-size:26px}
.user-info{color:var(--muted);font-size:13px}
.logout{background:#eee;color:var(--purple);border:0;padding:10px 16px;border-radius:8px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:17px;margin-bottom:25px}
.card,.panel{
background:white;padding:22px;border-radius:13px;
box-shadow:0 3px 15px #24152a0c;margin-bottom:20px
}
.card span{color:var(--muted);font-size:13px}
.card h2{color:var(--purple);font-size:27px;margin:12px 0 0}
.panel h2,.panel h3{color:var(--purple);margin-top:0}
.gold{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
form{display:grid;gap:13px}
label{font-size:13px;font-weight:bold;color:var(--purple)}
input,select,textarea{
width:100%;padding:12px;border:1px solid #ddd;border-radius:7px;
background:white;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.btn{
border:0;padding:12px 17px;border-radius:7px;
background:var(--gold);color:var(--purple);font-weight:bold
}
.btn-dark{background:var(--purple);color:white}
.btn-danger{background:#f8e4e4;color:var(--red)}
.btn-small{padding:7px 10px;font-size:12px;margin:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:13px;text-align:left;border-bottom:1px solid #eee;font-size:13px}
th{background:#f8f4ed;color:var(--purple)}
.badge{padding:5px 9px;border-radius:20px;font-size:11px;background:#eee}
.badge.green{background:#e0f3e8;color:var(--green)}
.badge.red{background:#fbe5e5;color:var(--red)}
.badge.gold-bg{background:#f6eddc;color:#89652c}
.product-card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 15px #0001}
.product-image{height:160px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:60px}
.product-details{padding:16px}
.product-details h3{color:var(--purple);margin:5px 0}
.product-details p{font-size:13px;color:var(--muted)}
.price{color:#a57c35;font-size:20px;font-weight:bold}
.notice{background:#fff4d9;padding:13px;border-radius:8px;font-size:13px;color:#755722;margin:12px 0}
.empty{text-align:center;padding:30px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}

@media(max-width:760px){
.sidebar{position:relative;width:100%;height:auto}
.brand{margin-bottom:15px}
.nav{display:flex;flex-wrap:wrap}
.nav-label{width:100%}
.nav button{width:auto;padding:10px}
.main{margin-left:0;padding:17px}
.topbar{align-items:flex-start}
.topbar h1{font-size:21px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen" class="login-screen">
<div class="login-card">
<div class="logo">✧</div>
<h2>LUXE JEWELRY</h2>
<p>Jewelry Management System</p>

<div id="loginFormArea">
<form id="loginForm">
<label>Username or Email</label>
<input id="loginUser" required placeholder="Enter username or email">
<label>Password</label>
<input id="loginPass" type="password" required placeholder="Enter password">
<button class="btn" type="submit">LOGIN</button>
</form>
<p class="notice">Demo administrator: admin / admin123</p>
<div class="login-switch">
<button class="btn btn-dark" id="showRegister" type="button">Create Customer Account</button>
</div>
</div>

<div id="registerArea" class="hidden">
<h3>Customer Registration</h3>
<form id="registerForm">
<label>Full Name</label><input id="regName" required>
<label>Email</label><input id="regEmail" type="email" required>
<label>Phone Number</label><input id="regPhone" required>
<label>Password</label><input id="regPassword" type="password" minlength="4" required>
<button class="btn" type="submit">REGISTER</button>
</form>
<div class="login-switch">
<button id="showLogin" class="btn btn-dark" type="button">Back to Login</button>
</div>
</div>
</div>
</section>

<!-- APPLICATION -->
<div id="application" class="app hidden">
<aside class="sidebar">
<div class="brand">✧ LUXE JEWELRY<small>MANAGEMENT SYSTEM</small></div>
<div class="nav" id="navigation"></div>
</aside>

<main class="main">
<div class="topbar">
<div>
<h1 id="pageTitle">Dashboard</h1>
<div class="user-info" id="welcome"></div>
</div>
<button class="logout" id="logout">Logout ↗</button>
</div>
<div id="content"></div>
<footer>Luxe Jewelry Management System | 2026</footer>
</main>
</div>

<script>
const $=id=>document.getElementById(id);
const read=(key,def=[])=>{
try{return JSON.parse(localStorage.getItem(key))||def}catch{return def}
};
const save=(key,value)=>localStorage.setItem(key,JSON.stringify(value));
const money=n=>"KSh "+Number(n||0).toLocaleString("en-KE");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let products=read("luxeProducts");
let sales=read("luxeSales");
let bookings=read("luxeBookings");
let payments=read("luxePayments");
let customers=read("luxeCustomers");
let currentUser=null;
let page="dashboard";

if(!localStorage.getItem("luxeProducts")){
products=[
{id:"p1",name:"Gold Necklace",category:"Necklaces",price:3500,quantity:10,material:"Gold"},
{id:"p2",name:"Diamond Ring",category:"Rings",price:8500,quantity:5,material:"Diamond"},
{id:"p3",name:"Silver Bracelet",category:"Bracelets",price:2000,quantity:12,material:"Silver"}
];
save("luxeProducts",products);
}

const admin={name:"Administrator",email:"admin@luxe.demo",username:"admin",password:"admin123",role:"admin"};

function persist(){
save("luxeProducts",products);
save("luxeSales",sales);
save("luxeBookings",bookings);
save("luxePayments",payments);
save("luxeCustomers",customers);
}

function showLogin(){
$("loginScreen").classList.remove("hidden");
$("application").classList.add("hidden");
currentUser=null;
}
function enterApp(user){
currentUser=user;
$("loginScreen").classList.add("hidden");
$("application").classList.remove("hidden");
$("welcome").textContent="Welcome, "+user.name;
buildNavigation();
showPage(user.role==="admin"?"dashboard":"shop");
}

$("showRegister").onclick=()=>{
$("loginFormArea").classList.add("hidden");
$("registerArea").classList.remove("hidden");
};
$("showLogin").onclick=()=>{
$("registerArea").classList.add("hidden");
$("loginFormArea").classList.remove("hidden");
};

$("loginForm").onsubmit=e=>{
e.preventDefault();
let u=$("loginUser").value.trim();
let p=$("loginPass").value;
if(u===admin.username&&p===admin.password){enterApp(admin);return}
let customer=customers.find(c=>(c.email.toLowerCase()===u.toLowerCase()||c.email===u)&&c.password===p);
if(customer){enterApp(customer);return}
alert("Incorrect login details. Please try again.");
};

$("registerForm").onsubmit=e=>{
e.preventDefault();
let email=$("regEmail").value.trim().toLowerCase();
if(customers.some(c=>c.email.toLowerCase()===email)){
alert("This email is already registered.");return;
}
let c={
id:"c"+Date.now(),name:$("regName").value.trim(),
email,phone:$("regPhone").value.trim(),
password:$("regPassword").value,role:"customer"
};
customers.push(c);persist();
alert("Registration successful. You can now log in.");
$("showLogin").click();
$("loginUser").value=email;
};

$("logout").onclick=()=>showLogin();

function buildNavigation(){
let adminLinks=[
["dashboard","Dashboard"],["products","Products"],["add","Add Product"],
["inventory","Inventory"],["sales","Sales"],["bookings","Bookings"],
["payments","Payments"],["reports","Reports"]
];
let customerLinks=[
["shop","Browse Jewelry"],["mybookings","My Bookings"],["mypayments","My Payments"]
];
let links=currentUser.role==="admin"?adminLinks:customerLinks;
$("navigation").innerHTML=
'<div class="nav-label">MAIN MENU</div>'+
links.map(([id,label])=>`<button data-page="${id}">${label}</button>`).join("");
$("navigation").querySelectorAll("button").forEach(b=>{
b.onclick=()=>showPage(b.dataset.page);
});
}

function showPage(name){
page=name;
let labels={
dashboard:"Dashboard",products:"Products",add:"Add Product",
inventory:"Inventory",sales:"Sales",bookings:"Booking Management",
payments:"Payment Records",reports:"Reports",shop:"Jewelry Collection",
mybookings:"My Bookings",mypayments:"My Payments"
};
$("pageTitle").textContent=labels[name]||name;
$("navigation").querySelectorAll("button").forEach(b=>{
b.classList.toggle("active",b.dataset.page===name);
});
render();
}

function render(){
let views={
dashboard:dashboardPage,products:productsPage,add:addPage,
inventory:inventoryPage,sales:salesPage,bookings:bookingsPage,
payments:paymentsPage,reports:reportsPage,shop:shopPage,
mybookings:myBookingsPage,mypayments:myPaymentsPage
};
$("content").innerHTML=views[page]?views[page]():"";
}

function dashboardPage(){
let stock=products.reduce((a,p)=>a+Number(p.quantity),0);
let value=products.reduce((a,p)=>a+p.price*p.quantity,0);
let completed=sales.reduce((a,s)=>a+s.total,0);
return `
<div class="cards">
<div class="card"><span>Total Products</span><h2>${products.length}</h2></div>
<div class="card"><span>Total Stock</span><h2>${stock}</h2></div>
<div class="card"><span>Sales Recorded</span><h2>${sales.length}</h2></div>
<div class="card"><span>Inventory Value</span><h2>${money(value)}</h2></div>
</div>
<div class="grid">
<div class="panel"><h2>Business Overview</h2>
<p>Welcome to your Jewelry Management System.</p>
<p>Products: ${products.length}</p>
<p>Registered customers: ${customers.length}</p>
<p>Bookings: ${bookings.length}</p>
<p>Recorded sales: ${sales.length}</p>
</div>
<div class="panel"><h2>Low Stock Alert</h2>
${products.filter(p=>p.quantity<=5).map(p=>`<p>${esc(p.name)} — ${p.quantity} remaining</p>`).join("")||"<p>No low-stock products.</p>"}
</div></div>`;
}

function addPage(){
return `<div class="panel"><h2>Register Jewelry Product</h2>
<form id="productForm">
<label>Product Name</label><input name="name" required>
<label>Category</label><select name="category">
${["Rings","Necklaces","Bracelets","Earrings","Watches","Other"].map(x=>`<option>${x}</option>`).join("")}
</select>
<label>Price (KSh)</label><input name="price" type="number" min="1" required>
<label>Quantity</label><input name="quantity" type="number" min="0" required>
<label>Material</label><input name="material" required>
<label>Image URL (optional)</label><input name="image" type="url" placeholder="https://...">
<label>Description (optional)</label><textarea name="description"></textarea>
<button class="btn">Save Product</button>
</form></div>`;
}

function productsPage(){
return `<div class="panel"><div class="topbar"><h2>Jewelry Products</h2>
<button class="btn" onclick="showPage('add')">+ Add Product</button></div>
<div class="grid">${products.map(p=>`
<div class="product-card">
<div class="product-image">${p.image?`<img src="${esc(p.image)}" alt="" style="width:100%;height:160px;object-fit:cover" onerror="this.style.display='none'">`:"💎"}</div>
<div class="product-details"><h3>${esc(p.name)}</h3>
<p>${esc(p.category)} · ${esc(p.material)}</p>
<div class="price">${money(p.price)}</div>
<p>Stock: ${p.quantity}</p>
<div class="actions">
<button class="btn btn-small" onclick="editProduct('${p.id}')">Edit</button>
<button class="btn btn-danger btn-small" onclick="deleteProduct('${p.id}')">Delete</button>
</div></div></div>`).join("")||'<p class="empty">No products added.</p>'}</div></div>`;
}

function inventoryPage(){
return `<div class="panel"><h2>Inventory Overview</h2><div class="table-wrap"><table>
<tr><th>Product</th><th>Category</th><th>Price</th><th>Quantity</th><th>Status</th></tr>
${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${p.quantity}</td><td><span class="badge ${p.quantity===0?"red":p.quantity<=5?"gold-bg":"green"}">${p.quantity===0?"Out of Stock":p.quantity<=5?"Low Stock":"In Stock"}</span></td></tr>`).join("")}
</table></div></div>`;
}

function salesPage(){
return `<div class="grid"><div class="panel"><h2>Record a Sale</h2>
<form id="saleForm"><label>Select Product</label><select name="product" required>
${products.filter(p=>p.quantity>0).map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (${p.quantity} available)</option>`).join("")}
</select><label>Quantity Sold</label><input name="quantity" type="number" min="1" required>
<button class="btn">Record Sale</button></form></div>
<div class="panel"><h2>Sales Summary</h2><h2 class="gold">${money(sales.reduce((a,s)=>a+s.total,0))}</h2><p>Total recorded sales value</p></div></div>
<div class="panel"><h2>Sales History</h2>${sales.map(s=>`<p>${esc(s.name)} — ${s.quantity} sold — ${money(s.total)} — ${esc(s.date)}</p>`).join("")||"No sales recorded."}</div>`;
}

function bookingsPage(){
return `<div class="panel"><h2>Customer Bookings</h2><div class="table-wrap"><table>
<tr><th>Customer</th><th>Product</th><th>Date</th><th>Phone</th><th>Status</th><th>Action</th></tr>
${bookings.map(b=>`<tr><td>${esc(b.customer)}</td><td>${esc(b.product)}</td><td>${esc(b.date)}</td><td>${esc(b.phone)}</td><td>${esc(b.status)}</td><td><button class="btn btn-small" onclick="updateBooking('${b.id}','Confirmed')">Confirm</button><button class="btn btn-small btn-danger" onclick="updateBooking('${b.id}','Cancelled')">Cancel</button></td></tr>`).join("")}
</table></div></div>`;
}

function paymentsPage(){
return `<div class="panel"><h2>Payment Records</h2><div class="table-wrap"><table>
<tr><th>Customer</th><th>Item</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr>
${payments.map(p=>`<tr><td>${esc(p.customer)}</td><td>${esc(p.product)}</td><td>${money(p.amount)}</td><td>${esc(p.method)}</td><td><span class="badge gold-bg">${esc(p.status)}</span></td><td>${esc(p.date)}</td></tr>`).join("")}
</table></div><p class="notice">All payments shown here are simulated demonstrations. No real money is collected.</p></div>`;
}

function reportsPage(){
let total=sales.reduce((a,s)=>a+s.total,0);
return `<div class="panel"><h2>Business Reports</h2>
<div class="cards"><div class="card"><span>Products</span><h2>${products.length}</h2></div>
<div class="card"><span>Bookings</span><h2>${bookings.length}</h2></div>
<div class="card"><span>Sales Value</span><h2>${money(total)}</h2></div></div>
<button class="btn" onclick="exportCSV()">Export Products CSV</button>
<button class="btn btn-dark" onclick="window.print()">Print Report</button></div>`;
}

function shopPage(){
return `<div class="panel"><h2>Our Jewelry Collection</h2><p>Browse the available jewelry and reserve your preferred item.</p>
<div class="grid">${products.filter(p=>p.quantity>0).map(p=>`
<div class="product-card"><div class="product-image">💎</div>
<div class="product-details"><h3>${esc(p.name)}</h3><p>${esc(p.category)} · ${esc(p.material)}</p>
<div class="price">${money(p.price)}</div><p>${p.quantity} available</p>
<button class="btn" onclick="bookProduct('${p.id}')">Book This Item</button></div></div>`).join("")||"No available products."}</div></div>`;
}

function myBookingsPage(){
let mine=bookings.filter(b=>b.customerEmail===currentUser.email);
return `<div class="panel"><h2>Your Reservations</h2>
${mine.map(b=>`<p>${esc(b.product)} — ${esc(b.date)} — ${esc(b.status)}</p>`).join("")||"You have no bookings yet."}</div>`;
}

function myPaymentsPage(){
let mine=payments.filter(p=>p.customerEmail===currentUser.email);
return `<div class="panel"><h2>Your Payment Records</h2>
${mine.map(p=>`<p>${esc(p.product)} — ${money(p.amount)} — ${esc(p.method)} — ${esc(p.status)}</p>`).join("")||"You have no payment records yet."}</div>`;
}

$("content").addEventListener("submit",e=>{
e.preventDefault();
let f=e.target;

if(f.id==="productForm"){
let d=Object.fromEntries(new FormData(f));
products.push({id:"p"+Date.now(),name:d.name,category:d.category,price:Number(d.price),quantity:Number(d.quantity),material:d.material,image:d.image,description:d.description});
persist();alert("Product added successfully.");showPage("products");
}
if(f.id==="saleForm"){
let d=Object.fromEntries(new FormData(f));
let p=products.find(x=>x.id===d.product),q=Number(d.quantity);
if(!p||q<1||q>p.quantity){alert("Please enter a valid quantity.");return}
p.quantity-=q;
sales.push({id:"s"+Date.now(),name:p.name,quantity:q,total:p.price*q,date:new Date().toLocaleString()});
persist();alert("Sale recorded and stock updated.");showPage("sales");
}
});

function editProduct(id){
let p=products.find(x=>x.id===id);if(!p)return;
let name=prompt("Product name:",p.name);if(name===null)return;
let price=Number(prompt("Price:",p.price));
let quantity=Number(prompt("Quantity:",p.quantity));
if(!name.trim()||!Number.isFinite(price)||price<0||!Number.isInteger(quantity)||quantity<0){alert("Invalid details.");return}
p.name=name.trim();p.price=price;p.quantity=quantity;persist();render();
}
function deleteProduct(id){
if(!confirm("Delete this product?"))return;
products=products.filter(p=>p.id!==id);persist();render();
}
function updateBooking(id,status){
let b=bookings.find(x=>x.id===id);if(b)b.status=status;
persist();render();
}

function bookProduct(id){
let p=products.find(x=>x.id===id);if(!p)return;
let date=prompt("Enter your preferred booking date (YYYY-MM-DD):");
if(!date)return;
if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert("Enter the date as YYYY-MM-DD.");return}
let phone=prompt("Enter your phone number:");
if(!phone)return;
let b={id:"b"+Date.now(),customer:currentUser.name,customerEmail:currentUser.email,phone,product:p.name,productId:p.id,price:p.price,date,status:"Pending"};
bookings.push(b);persist();
if(confirm("Booking submitted! Would you like to make a demonstration payment now?"))makePayment(b);
alert("Your booking has been saved.");
showPage("mybookings");
}

function makePayment(b){
let method=prompt("Choose payment method: M-Pesa, Cash or Card","M-Pesa");
if(!method)return;
method=method.trim();
if(!["M-Pesa","Cash","Card"].some(x=>x.toLowerCase()===method.toLowerCase())){
alert("Choose M-Pesa, Cash or Card.");return;
}
let reference="DEMO"+Date.now().toString().slice(-8);
payments.push({
id:"pay"+Date.now(),customer:b.customer,customerEmail:b.customerEmail,
product:b.product,amount:b.price,method,status:"Demo Successful",
reference,date:new Date().toLocaleString()
});
persist();
alert("DEMO PAYMENT SUCCESSFUL\nReference: "+reference+"\nAmount: "+money(b.price)+"\nNo real money was transferred.");
}

function exportCSV(){
let rows=[["Product","Category","Price","Quantity","Material"],...products.map(p=>[p.name,p.category,p.price,p.quantity,p.material])];
let csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
a.download="jewelry-products-report.csv";a.click();URL.revokeObjectURL(a.href);
}

enterApp(admin);
showLogin();
</script>
</body>
</html>
